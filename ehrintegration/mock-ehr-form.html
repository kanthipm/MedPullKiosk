<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock EHR — Patient Intake</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 460px; margin: 40px auto; color: #1a1a1a; }
  h1 { font-size: 20px; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input, select { width: 100%; padding: 8px; box-sizing: border-box; }
  .checkbox-label { font-weight: 600; margin-top: 16px; }
  .checkbox-label input { width: auto; }
  #insuranceRow { display: none; }
  #insuranceRow.show { display: block; }
  button { margin-top: 22px; padding: 10px 18px; cursor: pointer; }
  #confirm { margin-top: 16px; color: #137333; font-weight: 700; display: none; }
</style>
</head>
<body>
  <h1>Patient Intake</h1>

  <!-- NOTE: this is a stand-in for the real EHR form. Recreate the real page's
       label text / structure here (captured via `npx playwright codegen`) so your
       locators match production. Run all local dev against this; validate on the
       clinic's TRAINING environment before touching production. -->

  <form id="intake">
    <label for="fn">First name</label>
    <input id="fn" name="fn">

    <label for="ln">Last name</label>
    <input id="ln" name="ln">

    <label for="dob">Date of birth</label>
    <input id="dob" name="dob" placeholder="YYYY-MM-DD">

    <label for="mrn">MRN</label>
    <input id="mrn" name="mrn">

    <label for="sex">Sex</label>
    <select id="sex" name="sex">
      <option value="">— select —</option>
      <option value="Female">Female</option>
      <option value="Male">Male</option>
      <option value="Other">Other</option>
    </select>

    <label for="phone">Phone</label>
    <input id="phone" name="phone">

    <label class="checkbox-label"><input type="checkbox" id="hasIns"> Has insurance</label>

    <div id="insuranceRow">
      <label for="ins">Insurance provider</label>
      <input id="ins" name="ins">
    </div>

    <button type="button" id="save">Save</button>
  </form>

  <div id="confirm">Patient record saved</div>

  <script>
    // Conditional field: only reveal the insurance provider when "Has insurance" is checked.
    const cb = document.getElementById('hasIns');
    const row = document.getElementById('insuranceRow');
    cb.addEventListener('change', () => row.classList.toggle('show', cb.checked));

    // Pretend to persist, then show the confirmation the automation asserts on.
    document.getElementById('save').addEventListener('click', () => {
      document.getElementById('confirm').style.display = 'block';
    });
  </script>
</body>
</html>
